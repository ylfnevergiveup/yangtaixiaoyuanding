name: Deploy to Tencent CloudBase

on:
  workflow_dispatch:
  repository_dispatch:
    types: [cms-updated]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Login to CloudBase
        run: npx cloudbase login --apiKeyId "${{ secrets.TENCENTCLOUD_SECRET_ID }}" --apiKey "${{ secrets.TENCENTCLOUD_SECRET_KEY }}"

      - name: Deploy to CloudBase
        run: npm run deploy
