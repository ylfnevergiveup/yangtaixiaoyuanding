        - generic [ref=e53]:
          - heading "春季阳台种植正当时" [level=2] [ref=e54]
          - paragraph [ref=e56]: 春季（3-5月）是阳台园艺的黄金季节。气温回升、日照增长，大多数植物都适合在这个时期播种或移栽。
          - heading "推荐种植清单" [level=2] [ref=e58]
          - list [ref=e60]:
            - listitem [ref=e61]: 番茄：3-4月育苗，5月移栽，7月即可收获。
            - listitem [ref=e62]: 辣椒：3月室内育苗，稳定15℃以上后移出。
            - listitem [ref=e63]: 罗勒：4月直接播种，喜温暖，出苗快。
            - listitem [ref=e64]: 生菜：可分批播种，实现持续收获。
            - listitem [ref=e65]: 草莓：春季购买幼苗种植，当年可结果。
            - listitem [ref=e66]: 黄瓜：4月播种，需搭架攀爬。
            - listitem [ref=e67]: 四季豆：4月直播，生长迅速。
            - listitem [ref=e68]: 向日葵：3-4月播种，观赏性强。
            - listitem [ref=e69]: 薄荷：分株繁殖，极易成活。
            - listitem [ref=e70]: 薰衣草：3月播种，喜阳光充足。
          - heading "春季养护要点" [level=2] [ref=e72]
          - paragraph [ref=e74]: 春季气温波动大，注意倒春寒。晴朗天气多开窗通风，促进植物光合作用。开始恢复施肥频率，春季是生长旺盛期。
