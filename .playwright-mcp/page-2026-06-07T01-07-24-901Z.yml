        - heading "阳台种菜小白入门指南" [level=1] [ref=e51]
        - generic [ref=e53]:
          - heading "第一步：确定你的阳台条件" [level=2] [ref=e54]
          - paragraph [ref=e56]: 在开始种植之前，你需要评估阳台的几个关键条件：光照时长、通风情况和可用空间。南向阳台光照最充足，适合大多数蔬菜和花卉；东向阳台有上午柔和的光线，适合绿叶蔬菜和喜半阴植物；北向阳台光照较少，适合耐阴植物如绿萝、蕨类。
          - heading "第二步：选择合适的容器" [level=2] [ref=e58]
          - paragraph [ref=e60]: 容器选择遵循'宁大勿小'原则。一般叶菜类需要15-20cm深的盆，果菜类需要25-35cm深的盆。材质上推荐陶盆（透气好）或加仑盆（轻便耐用）。底部必须有排水孔，这是植物健康生长的关键。
          - heading "第三步：配制合适的土壤" [level=2] [ref=e62]
          - paragraph [ref=e64]: 不要直接使用园土！推荐配方：泥炭土（40%）+ 珍珠岩（30%）+ 蛭石（30%），这种配比透气保水又轻盈。如果种植果菜类，可加入少量腐熟羊粪作为底肥。
          - heading "第四步：选择合适的种子/幼苗" [level=2] [ref=e66]
          - paragraph [ref=e68]: 新手建议从种子育苗开始，但也可以直接购买幼苗降低难度。推荐入手：樱桃番茄、生菜、薄荷、小葱——这些植物对新手非常友好。
          - heading "第五步：日常养护要点" [level=2] [ref=e70]
          - paragraph [ref=e72]: 浇水'见干见湿'，用手指插入土壤2cm感受湿度。施肥'薄肥勤施'，生长季每7-10天施一次液肥。及时关注病虫害，早发现早处理。
