            - generic [ref=e83]:
              - generic [ref=e84]: 🏡 阳台适配
              - generic [ref=e85]:
                - paragraph [ref=e86]: 番茄（含圣女果）是强阳性喜温作物，每天需要6-8小时以上直射阳光才能正常开花结果，阳台朝向直接决定了光照时长和强度，是种植成败的第一要素。
                - paragraph [ref=e87]: 🏆 第一名：正南向阳台（完美适配）
                - paragraph [ref=e88]: • 核心优势：全天光照最充足、最均匀，夏季直射6-10小时，冬季4-6小时，完全满足番茄生长需求
                - paragraph [ref=e89]: • 温度特点：夏季中午温度可达35℃以上，冬季比其他朝向高3-5℃
                - paragraph [ref=e90]: • 适配性：
                - paragraph [ref=e91]: ◦ 全年可种（广东等南方地区），春播、秋播、冬播都能高产
                - paragraph [ref=e92]: ◦ 适合所有番茄品种，尤其是无限生长型和大果型
                - paragraph [ref=e93]: • 注意事项：
                - paragraph [ref=e94]: ◦ 夏季（6-8月）中午12-2点需适当遮阴，避免叶片和果实被灼伤
                - paragraph [ref=e95]: ◦ 通风要好，否则高温高湿容易引发病虫害
                - paragraph [ref=e96]: 🥈 第二名：西南向阳台（次优选择）
                - paragraph [ref=e97]: • 核心优势：下午光照极强，全天直射5-8小时，光照强度足够
                - paragraph [ref=e98]: • 温度特点：下午2-5点温度最高，西晒明显，夏季容易超过38℃
                - paragraph [ref=e99]: • 适配性：
                - paragraph [ref=e100]: ◦ 适合秋播和冬播，春播后期需注意降温
                - paragraph [ref=e101]: ◦ 优先选择耐热品种（如千禧、釜山88）
                - paragraph [ref=e102]: • 注意事项：
                - paragraph [ref=e103]: ◦ 夏季必须遮阴，否则会严重落花落果
                - paragraph [ref=e104]: ◦ 浇水要比南向阳台更频繁，避免干旱
                - paragraph [ref=e105]: 🥉 第三名：东南向阳台（温和友好）
                - paragraph [ref=e106]: • 核心优势：上午光照充足且温和，全天直射5-7小时，不会出现极端高温
                - paragraph [ref=e107]: • 温度特点：上午温度上升快，下午温度较低，昼夜温差适中
                - paragraph [ref=e108]: • 适配性：
                - paragraph [ref=e109]: ◦ 特别适合春播和夏播，果实口感好
                - paragraph [ref=e110]: ◦ 适合所有矮生品种和樱桃番茄
                - paragraph [ref=e111]: • 注意事项：
                - paragraph [ref=e112]: ◦ 下午光照不足，植株可能会轻微徒长，需要适当控水控肥
                - paragraph [ref=e113]: ◦ 冬季光照时间较短，收获会延迟5-7天
                - paragraph [ref=e114]: ⚠️ 第四名：东向/西向阳台（勉强可种）
                - paragraph [ref=e115]: 东向阳台
                - paragraph [ref=e116]: • 只有上午有直射光，全天3-5小时，光照时长不足
                - paragraph [ref=e117]: • 只能种植早熟、耐阴的矮生樱桃番茄品种
                - paragraph [ref=e118]: • 必须配合补光灯，每天补光4-6小时，否则只长叶不结果
                - paragraph [ref=e119]: 西向阳台
                - paragraph [ref=e120]: • 只有下午有直射光，全天3-4小时，且西晒严重
                - paragraph [ref=e121]: • 夏季温度过高，容易灼伤植株，冬季光照不足
                - paragraph [ref=e122]: • 同样需要补光，且夏季必须做好遮阴降温
                - paragraph [ref=e123]: ❌ 第五名：北向阳台（完全不适合）
                - paragraph [ref=e124]: • 几乎没有直射阳光，只有散射光，全天光照不足2小时
                - paragraph [ref=e125]: • 番茄会严重徒长，茎秆细弱，不开花不结果，即使结果也会很小且口感极差
                - paragraph [ref=e126]: • 建议改种耐阴蔬菜（如生菜、菠菜、香菜）
