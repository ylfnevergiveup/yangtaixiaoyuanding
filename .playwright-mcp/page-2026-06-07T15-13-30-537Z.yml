        - generic [ref=e155]:
          - heading "💡 种植小贴士" [level=2] [ref=e156]
          - generic [ref=e157]:
            - paragraph [ref=e158]: 一、最佳种植季节（精准到月份）
            - paragraph [ref=e159]: • 南方地区（广东、广西、福建、海南等）：
            - paragraph [ref=e160]: ◦ 春播：2月中旬-3月上旬（最佳），4-7月收获
            - paragraph [ref=e161]: ◦ 秋播：8月下旬-9月上旬，11月-次年1月收获
            - paragraph [ref=e162]: ◦ 冬季：11月上旬播种，需放在室内温暖处，次年2-4月收获
            - paragraph [ref=e163]: • 长江流域：
            - paragraph [ref=e164]: ◦ 春播：3月中旬-4月上旬，6-8月收获
            - paragraph [ref=e165]: ◦ 秋播：7月下旬-8月上旬，10-11月收获
            - paragraph [ref=e166]: • 北方地区：
            - paragraph [ref=e167]: ◦ 春播：4月中旬-5月上旬（室内育苗可提前至3月），7-9月收获
            - paragraph [ref=e168]: ◦ 秋播：不建议露地，室内可6月下旬播种，9-10月收获
            - paragraph [ref=e169]: 关键提示：番茄最适宜生长温度为20-28℃，低于10℃停止生长，高于35℃会落花落果。
            - paragraph [ref=e170]: 二、品种选择（阳台专属）
            - paragraph [ref=e171]: 优先选择矮生、早熟、抗病、株高不超过1米的品种，无需搭架或只需简单支撑：
            - paragraph [ref=e172]: • 樱桃番茄（圣女果）：千禧、釜山88、黑珍珠、金太阳（单果重10-20g，产量高，口感好）
            - paragraph [ref=e173]: • 矮生大番茄：矮生红珍珠、小矮人、阳台丰收（单果重100-200g，适合盆栽）
            - paragraph [ref=e174]: • 特色品种：马蹄番茄（沙瓤）、绿宝石（绿色成熟）、黑美人（紫黑色）
            - paragraph [ref=e175]: 三、准备工作
            - paragraph [ref=e176]: 1. 容器选择
            - paragraph [ref=e177]: • 大小要求：单株番茄需要直径25cm以上、深度30cm以上的花盆，容量≥10L
            - paragraph [ref=e178]: • 材质：陶盆、塑料盆、加仑盆均可，底部必须有排水孔
            - paragraph [ref=e179]: • 数量：一个标准阳台（3-4㎡）可种植6-8株
            - paragraph [ref=e180]: 2. 土壤配比（新手直接用这个配方）
            - paragraph [ref=e181]: • 通用配方：泥炭土6份+珍珠岩2份+腐熟有机肥2份
            - paragraph [ref=e182]: • 简易配方：园土4份+腐叶土4份+河沙2份
            - paragraph [ref=e183]: • 底肥：每盆加入100g腐熟羊粪或鸡粪，与底部土壤混合均匀
            - paragraph [ref=e184]: 注意：不要直接使用纯园土，容易板结；不要使用未腐熟的生肥，会烧根。
            - paragraph [ref=e185]: 四、播种与育苗（最关键步骤）
            - paragraph [ref=e186]: 1. 种子处理
            - paragraph [ref=e187]: • 用55℃温水浸泡种子15分钟，不断搅拌
            - paragraph [ref=e188]: • 然后用常温清水浸泡6-8小时
            - paragraph [ref=e189]: • 捞出后用湿纱布包裹，放在25-30℃环境下催芽，每天用清水冲洗1次
            - paragraph [ref=e190]: • 2-3天后，种子露白即可播种
            - paragraph [ref=e191]: 2. 播种
            - paragraph [ref=e192]: • 在育苗盘或小纸杯里装入育苗土，浇透水
            - paragraph [ref=e193]: • 每个穴播1粒露白的种子，覆盖0.5-1cm厚的细土
            - paragraph [ref=e194]: • 盖上保鲜膜，扎几个小孔透气
            - paragraph [ref=e195]: • 放在25-30℃的温暖处，保持土壤湿润
            - paragraph [ref=e196]: 3. 育苗管理
            - paragraph [ref=e197]: • 出苗前：不需要光照，每天检查土壤湿度，干了就喷点水
            - paragraph [ref=e198]: • 出苗后：立即去掉保鲜膜，移到光照充足的地方
            - paragraph [ref=e199]: • 间苗：如果一个穴里长出多棵苗，只保留最健壮的1棵
            - paragraph [ref=e200]: • 假植：当幼苗长出2-3片真叶时，移栽到10cm左右的小盆里
            - paragraph [ref=e201]: • 定植：当幼苗长出4-6片真叶、高度15-20cm时，移栽到准备好的大花盆里
            - paragraph [ref=e202]: 定植要点：带土移栽，不要伤根；定植后浇透定根水；放在阴凉处缓苗3-5天，然后移到阳光下。
            - paragraph [ref=e203]: 五、核心养护管理（新手必看）
            - paragraph [ref=e204]: 1. 光照需求（绝对不能少）
            - paragraph [ref=e205]: • 每天需要6-8小时以上的直射阳光，最好是上午9点到下午5点的阳光
            - paragraph [ref=e206]: • 光照不足会导致植株徒长、开花少、结果少、口感差
            - paragraph [ref=e207]: • 如果阳台光照不足，需要使用补光灯，每天补光10-12小时，距离植株30-40cm
            - paragraph [ref=e208]: 2. 浇水频率（精准到天）
            - paragraph [ref=e209]: 浇水原则：见干见湿，不干不浇，浇则浇透
